<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <h1>Number Guessing Game</h1>

      <p>Guess a number between 1 and 100</p>

      <input
        type="Number"
        id="guessInput"
        placeholder="Enter Number"
        min="1"
        max="100"
      /><br /><br />

      <button onclick="checkGuess()" id="submitButton">Submit</button>

      <p id="feedback"></p>

      <p>
        Attempts :-
        <strong id="attemptsDisplay">0</strong>
      </p>

      <p>Number that you Guesses :-</p>

      <p id="previousGuesses">No guesses yet.</p>

      <button id="resetButton">New Game</button><br /><br />
    </div>
    <script src="index.js"></script>
  </body>
</html>
